name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Bind apex domain to Worker
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          path = Path("dist/server/wrangler.json")
          config = json.loads(path.read_text())
          config["name"] = "starrylight-art"
          config["account_id"] = "877cac129d6ac7b1022a9d4b386a5bc9"
          config["routes"] = [
              {"pattern": "starrylight.art", "custom_domain": True},
              {"pattern": "www.starrylight.art", "custom_domain": True},
          ]
          path.write_text(json.dumps(config, indent=2) + "\n")
          PY
      - name: Publish
        run: npx wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 877cac129d6ac7b1022a9d4b386a5bc9
